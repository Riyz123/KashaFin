sonar.projectKey=KashaFin
sonar.projectName=KashaFin
sonar.host.url=http://localhost:9000

# Código fuente real de la app — se deja fuera vendor/, node_modules/,
# storage/ y bootstrap/cache/ porque son generados o de terceros, no código
# propio que valga la pena analizar.
sonar.sources=app,routes,database,config,resources
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**

sonar.sourceEncoding=UTF-8
